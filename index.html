<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подслушка 21 школы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --btn-color: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .card {
            background: var(--sec-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        h2 { margin-top: 0; font-size: 20px; }
        textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid rgba(128, 128, 128, 0.25);
            border-radius: 10px;
            padding: 12px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        .file-label {
            display: block;
            margin-top: 12px;
            padding: 10px;
            border: 1px dashed var(--btn-color);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
        }
        #preview {
            display: none;
            width: 100%;
            max-height: 220px;
            object-fit: cover;
            border-radius: 10px;
            margin-top: 10px;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 14px 0;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: var(--btn-color);
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; }
        #admin-box { display: none; border: 1px solid var(--btn-color); }
    </style>
</head>
<body>

    <h2>🤫 Подслушка 21 школы</h2>

    <div class="card">
        <textarea id="post-text" placeholder="Напиши свою историю, сплетню или вопрос..."></textarea>
        
        <label class="file-label">
            📷 Прикрепить фото / мем
            <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewFile()">
        </label>
        <img id="preview" alt="Предпросмотр">

        <div class="toggle-row">
            <label for="anon-check">Опубликовать анонимно 🕵️</label>
            <input type="checkbox" id="anon-check" checked style="transform: scale(1.3);">
        </div>
        <button id="submit-btn" onclick="sendPost()">Отправить в предложку</button>
    </div>

    <div class="card" id="admin-box">
        <h3 style="margin-top:0; font-size:16px;">📢 Рассылка всем (Админ)</h3>
        <textarea id="bc-text" placeholder="Текст рассылки для всех пользователей..." style="min-height: 80px;"></textarea>
        <button onclick="sendBroadcast()" style="margin-top: 10px;">Отправить всем</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ВСТАВЬТЕ СЮДА БЕСПЛАТНЫЙ КЛЮЧ С САЙТА https://api.imgbb.com/
        const IMGBB_API_KEY = "ВАШ_КЛЮЧ_IMGBB";

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === '1') {
            document.getElementById('admin-box').style.display = 'block';
        }

        function previewFile() {
            const file = document.getElementById('photo-input').files[0];
            const preview = document.getElementById('preview');
            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        }

        async function sendPost() {
            const text = document.getElementById('post-text').value.trim();
            const isAnon = document.getElementById('anon-check').checked;
            const fileInput = document.getElementById('photo-input');
            const file = fileInput.files[0];

            if (!text && !file) {
                return tg.showAlert("Напишите текст или прикрепите фотографию!");
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Загрузка...";

            let photoUrl = null;

            if (file) {
                const formData = new FormData();
                formData.append("image", file);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });
                    const json = await res.json();
                    if (json.success) {
                        photoUrl = json.data.url;
                    } else {
                        btn.disabled = false;
                        btn.innerText = "Отправить в предложку";
                        return tg.showAlert("Ошибка загрузки фото. Проверьте ключ IMGBB_API_KEY!");
                    }
                } catch (e) {
                    btn.disabled = false;
                    btn.innerText = "Отправить в предложку";
                    return tg.showAlert("Ошибка соединения при отправке картинки.");
                }
            }

            tg.sendData(JSON.stringify({
                action: "submit",
                text: text,
                is_anon: isAnon,
                photo_url: photoUrl
            }));
        }

        function sendBroadcast() {
            const text = document.getElementById('bc-text').value.trim();
            if (!text) return tg.showAlert("Введите текст рассылки!");
            tg.sendData(JSON.stringify({
                action: "broadcast",
                text: text
            }));
        }
    </script>
</body>
</html>
