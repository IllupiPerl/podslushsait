<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подслушано Школа</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 14px; background: #f0f2f5; color: #222; }
    
    .top-bar { background: #fff; padding: 10px 14px; border-radius: 12px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .badge { padding: 4px 8px; border-radius: 6px; font-weight: 600; font-size: 12px; }
    .badge.user { background: #eef2f7; color: #555; }
    .badge.admin { background: #fff3cd; color: #856404; }
    .admin-login-btn { background: none; border: 1px dashed #2481cc; color: #2481cc; border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer; }

    .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 10px; border: none; border-radius: 10px; background: #dfe3e8; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; }
    .tab.active { background: #2481cc; color: #fff; }

    .card { background: #fff; padding: 14px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
    textarea { width: 100%; height: 110px; padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; resize: none; font-size: 15px; outline: none; }
    textarea:focus { border-color: #2481cc; }
    .input-field { width: 100%; padding: 8px 10px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 14px; margin-top: 8px; }
    
    .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; font-size: 14px; cursor: pointer; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #2481cc; color: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: 0.6; }
    .btn-row { display: flex; gap: 8px; margin-top: 10px; }
    .btn-approve { background: #2ecc71; }
    .btn-reject { background: #e74c3c; }

    .msg-box { padding: 10px 12px; border-radius: 8px; font-size: 13px; font-weight: 500; margin-bottom: 12px; display: none; word-break: break-word; }
    .msg-box.success { display: block; background: #d4edda; color: #155724; }
    .msg-box.error { display: block; background: #f8d7da; color: #721c24; }

    .status { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; margin-bottom: 8px; }
    .status.pending { background: #fff3cd; color: #856404; }
    .status.approved { background: #d4edda; color: #155724; }
    .status.rejected { background: #f8d7da; color: #721c24; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Верхняя панель с ID и статусом роли -->
  <div class="top-bar">
    <div>
      <div id="userName" style="font-weight: 600;">👤 Загрузка...</div>
      <div id="userIdText" style="color: #777; font-size: 11px; margin-top: 2px;">ID: ...</div>
    </div>
    <div style=" display: flex; align-items: center; gap: 6px;">
      <span id="roleBadge" class="badge user">Ученик</span>
      <button id="adminLoginBtn" class="admin-login-btn" onclick="toggleAdminBox()">🔑 Админ</button>
    </div>
  </div>

  <!-- Быстрый вход для админа по паролю -->
  <div id="adminPassBox" class="card hidden">
    <div style="font-size: 13px; font-weight: 600; margin-bottom: 6px;">Введите пароль модератора:</div>
    <div style="display: flex; gap: 8px;">
      <input type="password" id="adminPassInput" class="input-field" style="margin-top:0;" placeholder="Пароль...">
      <button class="btn" style="width: auto; padding: 8px 16px;" onclick="unlockAdmin()">Войти</button>
    </div>
  </div>

  <!-- Блок для вывода уведомлений и ошибок -->
  <div id="notifyBox" class="msg-box"></div>

  <!-- Вкладки навигации -->
  <div class="tabs">
    <button class="tab active" id="btn-create" onclick="switchTab('create')">Написать</button>
    <button class="tab" id="btn-history" onclick="switchTab('history')">Мои посты</button>
    <button class="tab hidden" id="btn-mod" onclick="switchTab('mod')">Модерация</button>
  </div>

  <!-- Вкладка 1: Предложить пост -->
  <div id="tab-create" class="card">
    <textarea id="postContent" placeholder="Напишите ваше сообщение в Подслушано..."></textarea>
    <label class="checkbox-row">
      <input type="checkbox" id="isAnon" checked> Опубликовать анонимно
    </label>
    <button class="btn" id="sendBtn" onclick="submitPost()">Отправить на проверку</button>
  </div>

  <!-- Вкладка 2: История -->
  <div id="tab-history" class="hidden">
    <div id="historyList">Загрузка...</div>
  </div>

  <!-- Вкладка 3: Модерация -->
  <div id="tab-mod" class="hidden">
    <div id="modList">Загрузка...</div>
  </div>

  <script>
    // ================= НАСТРОЙКИ =================
    const SUPABASE_URL = 'ВАШ_SUPABASE_URL'; // Например: https://xxxx.supabase.co
    const SUPABASE_KEY = 'ВАШ_SUPABASE_KEY'; // Публичный ключ anon / publishable
    const BOT_TOKEN    = 'ВАШ_ТОКЕН_БОТА';   // Токен из @BotFather
    const CHANNEL_ID   = '@ваш_канал';       // Юзернейм канала с @ или ID (-100...)
    
    const ADMIN_IDS    = [123456789];        // Ваш Telegram ID (цифрами без кавычек)
    const ADMIN_PASS   = '12345';            // Пароль, чтобы войти в админку прямо с телефона
    // =============================================

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    // Определяем пользователя Telegram
    const user = tg?.initDataUnsafe?.user || { id: 111111, first_name: 'Гость', username: '' };
    const displayName = user.username ? '@' + user.username : (user.first_name || 'Ученик');

    document.getElementById('userName').innerText = '👤 ' + displayName;
    document.getElementById('userIdText').innerText = 'Ваш ID: ' + user.id;

    // Проверка прав администратора (по ID или сохраненному входу)
    let isAdmin = ADMIN_IDS.map(String).includes(String(user.id)) || localStorage.getItem('is_mod') === 'true';
    updateAdminUI();

    function updateAdminUI() {
      if (isAdmin) {
        document.getElementById('roleBadge').innerText = '👑 Админ';
        document.getElementById('roleBadge').className = 'badge admin';
        document.getElementById('btn-mod').classList.remove('hidden');
        document.getElementById('adminLoginBtn').classList.add('hidden');
        document.getElementById('adminPassBox').classList.add('hidden');
      }
    }

    function toggleAdminBox() {
      document.getElementById('adminPassBox').classList.toggle('hidden');
    }

    function unlockAdmin() {
      const val = document.getElementById('adminPassInput').value.trim();
      if (val === ADMIN_PASS) {
        isAdmin = true;
        localStorage.setItem('is_mod', 'true');
        updateAdminUI();
        showMessage('✅ Вы вошли как администратор! Открыта вкладка «Модерация».', 'success');
      } else {
        showMessage('❌ Неверный пароль администратора', 'error');
      }
    }

    function showMessage(text, type = 'success') {
      const box = document.getElementById('notifyBox');
      box.innerText = text;
      box.className = 'msg-box ' + type;
      setTimeout(() => { if (type === 'success') box.className = 'msg-box'; }, 5000);
    }

    // Универсальная функция прямого запроса к Supabase (без внешних библиотек)
    async function supabaseRequest(path, method = 'GET', body = null) {
      const cleanUrl = SUPABASE_URL.replace(/\/$/, '');
      const headers = {
        'apikey': SUPABASE_KEY,
        'Content-Type': 'application/json'
      };
      if (SUPABASE_KEY.startsWith('eyJ')) {
        headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
      }
      if (method !== 'GET') {
        headers['Prefer'] = 'return=representation';
      }

      const options = { method, headers };
      if (body) options.body = JSON.stringify(body);

      const res = await fetch(`${cleanUrl}/rest/v1/${path}`, options);
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch (e) {}

      if (!res.ok) {
        throw new Error(data?.message || data?.error || `Ошибка базы (${res.status})`);
      }
      return data;
    }

    // Переключение вкладок
    function switchTab(tab) {
      ['create', 'history', 'mod'].forEach(t => {
        document.getElementById('tab-' + t).classList.add('hidden');
        document.getElementById('btn-' + t).classList.remove('active');
      });
      document.getElementById('tab-' + tab).classList.remove('hidden');
      document.getElementById('btn-' + tab).classList.add('active');

      if (tab === 'history') loadHistory();
      if (tab === 'mod') loadModQueue();
    }

    // 1. Отправка сообщения
    async function submitPost() {
      const content = document.getElementById('postContent').value.trim();
      const isAnon = document.getElementById('isAnon').checked;
      const btn = document.getElementById('sendBtn');

      if (!content) return showMessage('Напишите текст сообщения!', 'error');

      btn.disabled = true;
      btn.innerText = 'Отправка...';

      try {
        await supabaseRequest('posts', 'POST', {
          user_id: user.id,
          user_name: displayName,
          content: content,
          is_anon: isAnon,
          status: 'pending'
        });
        document.getElementById('postContent').value = '';
        showMessage('✅ Сообщение отправлено на проверку модераторам!', 'success');
      } catch (err) {
        showMessage('❌ Ошибка отправки: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = 'Отправить на проверку';
      }
    }

    // 2. История постов пользователя
    async function loadHistory() {
      const container = document.getElementById('historyList');
      container.innerHTML = '<div class="card">Загрузка...</div>';

      try {
        const data = await supabaseRequest(`posts?user_id=eq.${user.id}&order=created_at.desc`);
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="card">Вы еще ничего не отправляли.</div>';
          return;
        }

        const statusLabels = {
          pending: '🟡 На рассмотрении',
          approved: '🟢 Одобрено и опубликовано',
          rejected: '🔴 Отклонено'
        };

        container.innerHTML = data.map(post => `
          <div class="card">
            <div class="status ${post.status}">${statusLabels[post.status] || post.status}</div>
            <div style="white-space: pre-wrap;">${escapeHtml(post.content)}</div>
            ${post.reject_reason ? `<div style="margin-top:8px; font-size:13px; color:#c0392b;">Причина отказа: ${escapeHtml(post.reject_reason)}</div>` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="card" style="color:#c0392b;">Ошибка загрузки: ${err.message}</div>`;
      }
    }

    // 3. Очередь модерации
    async function loadModQueue() {
      const container = document.getElementById('modList');
      container.innerHTML = '<div class="card">Загрузка очереди...</div>';

      try {
        const data = await supabaseRequest('posts?status=eq.pending&order=created_at.asc');
        if (!data || data.length === 0) {
          container.innerHTML = '<div class="card">Нет новых сообщений на проверку 🎉</div>';
          return;
        }

        container.innerHTML = data.map(post => `
          <div class="card" id="post-card-${post.id}">
            <div style="font-size:12px; color:#666; margin-bottom:6px;">
              Автор: <b>${post.is_anon ? '🕶 Анонимно' : escapeHtml(post.user_name)}</b> (ID: ${post.user_id})
            </div>
            <div style="font-size:15px; margin-bottom:10px; white-space: pre-wrap;">${escapeHtml(post.content)}</div>
            <input type="text" id="reason-${post.id}" class="input-field" placeholder="Причина отказа (если отклоняете)...">
            <div class="btn-row">
              <button class="btn btn-approve" onclick="approvePost(${post.id})">✅ В канал</button>
              <button class="btn btn-reject" onclick="rejectPost(${post.id})">❌ Отказать</button>
            </div>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = `<div class="card" style="color:#c0392b;">Ошибка: ${err.message}</div>`;
      }
    }

    // 4. Одобрение и отправка в Telegram-канал
    async function approvePost(postId) {
      try {
        const rows = await supabaseRequest(`posts?id=eq.${postId}`);
        const post = rows?.[0];
        if (!post) return;

        const prefix = post.is_anon ? '🕶 Анонимно:' : `📢 От ${post.user_name}:`;
        const textForChannel = `${prefix}\n\n${post.content}`;

        const tgRes = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHANNEL_ID, text: textForChannel })
        });
        const tgData = await tgRes.json();

        if (!tgData.ok) {
          return showMessage('❌ Ошибка Telegram: ' + tgData.description + ' (Проверьте, что бот добавлен в админы канала)', 'error');
        }

        await supabaseRequest(`posts?id=eq.${postId}`, 'PATCH', { status: 'approved' });
        showMessage('✅ Пост опубликован в канале!', 'success');
        loadModQueue();
      } catch (err) {
        showMessage('❌ Ошибка: ' + err.message, 'error');
      }
    }

    // 5. Отклонение поста
    async function rejectPost(postId) {
      const reasonInput = document.getElementById('reason-' + postId);
      const reason = reasonInput?.value.trim() || 'Не прошло модерацию';

      try {
        await supabaseRequest(`posts?id=eq.${postId}`, 'PATCH', {
          status: 'rejected',
          reject_reason: reason
        });
        showMessage('Пост отклонен', 'success');
        loadModQueue();
      } catch (err) {
        showMessage('❌ Ошибка: ' + err.message, 'error');
      }
    }

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    }
  </script>
</body>
</html>
