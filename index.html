<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подслушка 21 школы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #18222d);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #888888);
            --btn-color: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #131a22);
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 14px;
            padding-bottom: 40px;
        }
        h2 { margin: 0 0 12px 0; font-size: 20px; user-select: none; cursor: pointer; }
        h3 { margin: 0 0 10px 0; font-size: 16px; }
        
        .tabs {
            display: none;
            gap: 8px;
            margin-bottom: 14px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            background: var(--sec-bg);
            color: var(--text-color);
            border: 1px solid rgba(128, 128, 128, 0.2);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: var(--btn-color);
            color: var(--btn-text);
            border-color: var(--btn-color);
        }
        .tab-view { display: none; }
        .tab-view.active { display: block; }

        .card {
            background: var(--sec-bg);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 14px;
        }
        textarea, input[type="text"], input[type="number"] {
            width: 100%;
            border: 1px solid rgba(128, 128, 128, 0.25);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            margin-bottom: 8px;
        }
        textarea { min-height: 120px; resize: vertical; }
        .file-label {
            display: block;
            margin: 8px 0;
            padding: 11px;
            border: 1.5px dashed var(--btn-color);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        #preview-wrap { display: none; margin: 10px 0; }
        #preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 10px; }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: var(--btn-color);
            color: var(--btn-text);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.6; cursor: default; }
        
        .success-box {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2 onclick="secretTap()">🤫 Подслушка 21 школы</h2>

    <div class="tabs" id="admin-tabs">
        <button class="tab-btn active" id="btn-tab-user" onclick="switchTab('user', this)">✍️ Предложка</button>
        <button class="tab-btn" id="btn-tab-admin" onclick="switchTab('admin', this)">🛡️ Админ-панель</button>
    </div>

    <!-- ==================== ВКЛАДКА 1: ПРЕДЛОЖКА ==================== -->
    <div id="view-user" class="tab-view active">
        <div class="card">
            <div id="success-banner" class="success-box">
                ✅ Ваша заявка успешно отправлена на модерацию!
            </div>

            <textarea id="post-text" placeholder="Напиши свою историю, сплетню или вопрос..."></textarea>

            <label class="file-label">
                📷 Прикрепить фото / картинку
                <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="previewFile()">
            </label>

            <div id="preview-wrap">
                <img id="preview" alt="Предпросмотр">
                <button type="button" style="background:#ef4444; padding:8px; font-size:13px; margin-top:6px;" onclick="clearPhoto()">🗑 Удалить фото</button>
            </div>

            <div class="toggle-row">
                <label for="anon-check">Опубликовать анонимно 🕵️</label>
                <input type="checkbox" id="anon-check" checked style="transform: scale(1.3);">
            </div>
            <button id="submit-btn" onclick="sendPost()">Отправить в предложку</button>
        </div>
    </div>

    <!-- ==================== ВКЛАДКА 2: АДМИН-ПАНЕЛЬ (РАССЫЛКА) ==================== -->
    <div id="view-admin" class="tab-view">
        <div class="card">
            <h3>📢 Рассылка в канал / объявление</h3>
            <p style="font-size:13px; color:var(--hint-color); margin-top:0;">
                Отправляет объявление напрямую в канал подписчикам без закрытия окна.
            </p>
            <textarea id="bc-text" placeholder="Введите текст объявления..."></textarea>
            <button id="bc-btn" onclick="sendBroadcast()">Опубликовать объявление</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ==================== КОНФИГУРАЦИЯ БОТА ====================
        const BOT_TOKEN = "8623552053:AAFLZbvTvY-58Trd1eYQGV8zp4Zrp8DI-7s";
        const MOD_GROUP_ID = -1004427935626;  // Группа модерации
        const CHANNEL_ID = -1004498876602;    // Канал публикации
        const ALLOWED_ADMINS = [1389964621];  // ID администратора
        const IMGBB_API_KEY = "ВАШ_КЛЮЧ_IMGBB";

        const urlParams = new URLSearchParams(window.location.search);
        const currentUserId = tg?.initDataUnsafe?.user?.id || 0;

        let isAdmin = (
            urlParams.get('admin') === '1' ||
            ALLOWED_ADMINS.includes(currentUserId)
        );

        if (isAdmin) {
            enableAdminUI();
        }

        let tapCount = 0;
        function secretTap() {
            tapCount++;
            if (tapCount >= 5) {
                isAdmin = true;
                enableAdminUI();
                switchTab('admin', document.getElementById('btn-tab-admin'));
                tapCount = 0;
            }
        }

        function enableAdminUI() {
            document.getElementById('admin-tabs').style.display = 'flex';
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-view').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + tab).classList.add('active');
            btn.classList.add('active');
        }

        function previewFile() {
            const file = document.getElementById('photo-input').files[0];
            if (file) {
                document.getElementById('preview').src = URL.createObjectURL(file);
                document.getElementById('preview-wrap').style.display = 'block';
            }
        }

        function clearPhoto() {
            document.getElementById('photo-input').value = "";
            document.getElementById('preview-wrap').style.display = 'none';
        }

        function escapeHtml(s) {
            return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        // ==================== ОТПРАВКА БЕЗ ЗАКРЫТИЯ ВКЛАДКИ ====================
        // Отправка идёт напрямую в Telegram Bot API по HTTPS.
        // Поэтому вкладка Mini App НЕ закрывается (в отличие от tg.sendData),
        // а вам не нужно запускать никаких серверов на портах 8080 или туннелей!
        async function sendPost() {
            const text = document.getElementById('post-text').value.trim();
            const isAnon = document.getElementById('anon-check').checked;
            const file = document.getElementById('photo-input').files[0];

            if (!text && !file) {
                return tg ? tg.showAlert("Напишите текст или прикрепите фотографию!") : alert("Напишите текст или прикрепите фото!");
            }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = "Отправка...";

            let photoUrl = null;
            if (file) {
                // Если указан ключ ImgBB — грузим через него
                if (IMGBB_API_KEY && IMGBB_API_KEY !== "ВАШ_КЛЮЧ_IMGBB") {
                    const formData = new FormData();
                    formData.append("image", file);
                    try {
                        const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                            method: "POST",
                            body: formData
                        });
                        const json = await res.json();
                        if (json.success) {
                            photoUrl = json.data.url;
                        }
                    } catch (e) {
                        console.error("Ошибка ImgBB:", e);
                    }
                }
            }

            // Формируем карточку для группы модерации
            const user = tg?.initDataUnsafe?.user || {};
            const uid = user.id || currentUserId || 0;
            const username = user.username ? `@${user.username}` : (user.first_name || "Ученик");
            const anonStr = isAnon ? "Анонимно 🕵️" : `Публично (${escapeHtml(username)})`;
            const textBlock = text ? escapeHtml(text) : "<i>(Без текста, только фото)</i>";

            const modCaption = `📩 <b>Новая заявка из Mini App</b>\n` +
                               `👤 <b>Автор:</b> ${escapeHtml(username)} [<code>${uid}</code>]\n` +
                               `👁 <b>Режим:</b> ${anonStr}\n\n` +
                               `📝 <b>Текст:</b>\n${textBlock}`;

            const modKeyboard = {
                inline_keyboard: [
                    [
                        { text: "✅ Одобрить", callback_data: `mod:approve:0` },
                        { text: "❌ Отклонить", callback_data: `mod:reject:0` }
                    ],
                    [
                        { text: "⚠️ Варн (+1)", callback_data: `mod:warn:0:${uid}` },
                        { text: "🚫 Бан", callback_data: `mod:ban:0:${uid}` }
                    ]
                ]
            };

            try {
                let apiUrl;
                let payload;

                if (photoUrl) {
                    apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;
                    payload = {
                        chat_id: MOD_GROUP_ID,
                        photo: photoUrl,
                        caption: modCaption,
                        parse_mode: "HTML",
                        reply_markup: modKeyboard
                    };
                } else {
                    apiUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                    payload = {
                        chat_id: MOD_GROUP_ID,
                        text: modCaption,
                        parse_mode: "HTML",
                        reply_markup: modKeyboard
                    };
                }

                const resp = await fetch(apiUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const resJson = await resp.json();

                if (resJson.ok) {
                    // Очищаем форму и показываем баннер успеха БЕЗ закрытия вкладки
                    document.getElementById('post-text').value = "";
                    clearPhoto();
                    const banner = document.getElementById('success-banner');
                    banner.style.display = "block";
                    setTimeout(() => { banner.style.display = "none"; }, 4000);

                    if (tg) tg.showAlert("✅ Ваша заявка успешно отправлена на модерацию!");
                } else {
                    throw new Error(resJson.description || "Ошибка отправки в Telegram");
                }
            } catch (err) {
                // Если прямая отправка не удалась (например оффлайн), отправляем стандартным sendData как резерв
                console.warn("Резервный путь:", err);
                if (tg) {
                    tg.sendData(JSON.stringify({
                        action: "submit",
                        text: text,
                        is_anon: isAnon,
                        photo_url: photoUrl
                    }));
                } else {
                    alert("Ошибка отправки: " + err.message);
                }
            } finally {
                btn.disabled = false;
                btn.innerText = "Отправить в предложку";
            }
        }

        // ==================== РАССЫЛКА ИЗ АДМИНКИ ====================
        async function sendBroadcast() {
            const text = document.getElementById('bc-text').value.trim();
            if (!text) return tg ? tg.showAlert("Введите текст объявления!") : alert("Введите текст!");

            const btn = document.getElementById('bc-btn');
            btn.disabled = true;
            btn.innerText = "Публикация...";

            try {
                const resp = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        chat_id: CHANNEL_ID,
                        text: `📢 <b>Объявление:</b>\n\n${escapeHtml(text)}`,
                        parse_mode: "HTML"
                    })
                });
                const res = await resp.json();
                if (res.ok) {
                    document.getElementById('bc-text').value = "";
                    if (tg) tg.showAlert("✅ Объявление опубликовано в канале!");
                } else {
                    throw new Error(res.description || "Ошибка отправки");
                }
            } catch (e) {
                if (tg) tg.showAlert("Ошибка: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Опубликовать объявление";
            }
        }
    </script>
</body>
</html>
