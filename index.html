<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Подслушка 21 школы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --btn-color: var(--tg-theme-button-color, #3390ec);
            --btn-text: var(--tg-theme-button-text-color, #ffffff);
            --sec-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }
        .card {
            background: var(--sec-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }
        h2 { margin-top: 0; font-size: 20px; }
        textarea {
            width: 100%;
            min-height: 130px;
            border: 1px solid rgba(128, 128, 128, 0.25);
            border-radius: 10px;
            padding: 12px;
            background: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            outline: none;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 14px 0;
            font-size: 15px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background-color: var(--btn-color);
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        #admin-box { display: none; border: 1px solid var(--btn-color); }
    </style>
</head>
<body>

    <h2>🤫 Подслушка 21 школы</h2>

    <div class="card">
        <textarea id="post-text" placeholder="Напиши свою историю, сплетню или вопрос..."></textarea>
        <div class="toggle-row">
            <label for="anon-check">Опубликовать анонимно 🕵️</label>
            <input type="checkbox" id="anon-check" checked style="transform: scale(1.3);">
        </div>
        <button onclick="sendPost()">Отправить в предложку</button>
    </div>

    <!-- Секретная панель для админа (включается, если открыть ссылку с ?admin=1) -->
    <div class="card" id="admin-box">
        <h3 style="margin-top:0; font-size:16px;">📢 Рассылка всем (Админ)</h3>
        <textarea id="bc-text" placeholder="Текст рассылки для всех пользователей..." style="min-height: 80px;"></textarea>
        <button onclick="sendBroadcast()" style="margin-top: 10px;">Отправить всем</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Если в ссылке есть ?admin=1, показываем блок рассылки
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('admin') === '1') {
            document.getElementById('admin-box').style.display = 'block';
        }

        function sendPost() {
            const text = document.getElementById('post-text').value.trim();
            const isAnon = document.getElementById('anon-check').checked;
            if (!text) return tg.showAlert("Введите текст записи!");

            // Отправляем данные напрямую боту через Telegram без всяких серверов!
            tg.sendData(JSON.stringify({
                action: "submit",
                text: text,
                is_anon: isAnon
            }));
        }

        function sendBroadcast() {
            const text = document.getElementById('bc-text').value.trim();
            if (!text) return tg.showAlert("Введите текст рассылки!");

            tg.sendData(JSON.stringify({
                action: "broadcast",
                text: text
            }));
        }
    </script>
</body>
</html>
